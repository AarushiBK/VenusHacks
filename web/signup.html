<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a304d" />
  <title>Sign up — VitaCore</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-logo" aria-hidden="true">♥</div>
    <h1>VitaCore</h1>
    <p>Track symptoms and risk factors to protect your long-term cardiovascular health.</p>
  </header>

  <div class="auth-card">
    <form action="/" method="get">
      <label class="auth-field">
        <span>Name</span>
        <input type="text" name="name" placeholder="Your name" autocomplete="name" />
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn-auth-primary">Sign up</button>
    </form>
    <a href="/login.html" class="btn-auth-secondary">Already have an account</a>
  </div>

  <p class="auth-footer">Not a substitute for medical advice. Always consult your care team.</p>
</body>
</html>
